name: Desktop build and screenshot QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
        # npm cache is optional until a lockfile is committed
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static Astro site
        run: npm run build
      - name: Install Chromium for screenshot
        run: npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Serve and capture desktop
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/bella-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4321/ > /dev/null && break; sleep 1; done
          mkdir -p qa
          npx --yes playwright@1.58.2 screenshot --browser chromium --viewport-size "1536,1024" --wait-for-timeout 1500 --full-page http://127.0.0.1:4321/ qa/homepage-desktop.png
      - name: Upload screenshot and built HTML
        uses: actions/upload-artifact@v4
        with:
          name: bella-desktop-qa
          path: |
            qa/homepage-desktop.png
            dist/
          retention-days: 14
